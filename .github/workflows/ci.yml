name: CI / Code Quality & Pipeline Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest

      - name: Run Linter (Informational)
        run: |
          # Выводит предупреждения по стилю, но не останавливает сборку
          ruff check . --exit-zero

      - name: Run Unit Tests
        run: |
          # Проверяет только папку tests/
          pytest tests/
